name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pre-commit hook（lefthook）は --no-verify で迂回できるうえ CI では走らない。
      # 追跡ファイル全体を検査して、迂回・過去分の混入も落とす（docs/dev/tax-fixtures-plan.md）。
      # 検出パターンの単一ソースは pre-commit と共有のスクリプト側にある
      - name: No real account data tracked
        run: sh scripts/check-no-real-account-data.sh tracked
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      # 依存の脆弱性チェックは security.yml（npm audit --audit-level=high・ブロッキング）に
      # 一本化している。トリガーが同一で high は critical を含むため、ここに audit を置いても
      # security.yml の部分集合にしかならない。非ブロッキングな audit を重ねると
      # 「チェックがある」ように見えて実際には止まらないため、あえて置かない。
      - run: npx biome check cli/
      - run: npx tsc --noEmit
      - run: npx vitest run
